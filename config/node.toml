# tqsdk-node 数据服务进程入口配置
#
# 启动目录模式：
#   ./build-ui/tqsdk-node -c config
# node 不再配置 md/td；每个账户只选择一个 IPC 组。
# IPC 组文件在 config/ipc/<key>.toml，包含 transport/endpoint/超时/name。
[include]
files = [
    "shared/cache.toml",
]

primary_account = "default"

[[accounts]]
id = "default"
ipc = "gw-a"

# 第二个账户/网关示例：
# [[accounts]]
# id = "account-b"
# ipc = "gw-b"

[serve]
bind = "127.0.0.1"
port = 8080
symbols = []

[serve.ws]
path = "/stream"
heartbeat_interval_ms = 30000
max_clients = 256
max_queue = 1024

[audit]
enabled = false
file = "logs/audit.log"
max_bytes = 10485760
max_files = 5

[runtime]
threads = 4
