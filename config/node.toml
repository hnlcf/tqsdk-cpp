# tqsdk-node 数据服务进程示例配置
#
# node 以 Node 角色连接 gw 端点，把行情/交易合并为权威截面，再通过 HTTP serve
# 对外暴露。上游连接段沿用客户端配置语义（[ipc]/[md]/[td]），md/td 均设为 remote
# 并指向 gw 的监听端点。

[ipc]
# transport = "uds"
transport = "tcp"
encoding = "json"
handshake_timeout_ms = 5000
heartbeat_interval_ms = 5000
heartbeat_timeout_ms = 15000
local_name = "tqsdk-node"
# 注意：node 会强制以 node 角色握手（覆盖此处 role）。

# 上游行情（来自 gw）
[md]
kind = "remote"
# socket = "/tmp/tqsdk-gw.sock"
tcp_host = "127.0.0.1"
tcp_port = 4321

# 上游交易（来自 gw）
[td]
kind = "remote"
# socket = "/tmp/tqsdk-gw.sock"
tcp_host = "127.0.0.1"
tcp_port = 4321

ack_timeout_ms = 10000

# ---- 对外 serve 层 ----
[serve]
bind = "127.0.0.1"
port = 8080
# 启动即预订阅的合约（便于直接 curl 到数据）
symbols = []

# 同一端口上的 WebSocket 实时推送（ws://host:port/stream）
[serve.ws]
path = "/stream"
heartbeat_interval_ms = 30000
max_clients = 256
# 单连接待发送队列上限；慢消费者丢最旧行情
max_queue = 1024

# ---- 运行时线程 ----
# io_context worker 数。数据面（TqApi/DataManager/网关）绑定 core strand 串行；
# HTTP 每连接独立 strand，可在多个 worker 上并行处理 socket 读写。
[runtime]
threads = 4
