# tqsdk-gw 接入进程入口配置
#
# 启动目录模式：
#   ./build-ui/tqsdk-gw -c config
# load_gw_config("config") 会读取本文件，并解析 [include].files。
#
# 共享配置：
#   shared/ipc.toml   IPC 编码/超时
#   shared/tq.toml    TQ MD 默认地址、TqAuth、TQ TD 账户
#   shared/ctp.toml   CTP 前置和账户
#   shared/sim.toml   SimTd 规格/初始价格
#
# 切换网关只改本文件的 [md].kind / [td].kind：
#   sim:  td.kind = "sim"（默认）
#   ctp:  td.kind = "ctp"，构建需开启 -DTQSDK_ENABLE_CTP=ON
#   tq:   td.kind = "tq"，并把 auto_url 设为 true
[include]
files = [
    "shared/ipc.toml",
    "shared/tq.toml",
    "shared/ctp.toml",
    "shared/sim.toml",
]

[listen]
transport = "tcp"
tcp_host = "127.0.0.1"
tcp_port = 4321

[ipc]
# 覆盖 shared/ipc.toml 中的通用值
local_name = "tqsdk-gw"

# TQ MD 默认地址来自 shared/tq.toml；这里只选择 kind。
[md]
kind = "tq"

[td]
kind = "sim"

[runtime]
threads = 2
