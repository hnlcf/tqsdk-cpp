# TLS termination + static web terminal for TQSDK.
# The DEB/RPM installs web assets at /usr/share/tqsdk/web and node stays on
# 127.0.0.1:18081. Replace tqsdk.example.com and certificate paths.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name tqsdk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tqsdk.example.com;

    ssl_certificate     /etc/letsencrypt/live/tqsdk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tqsdk.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    root /usr/share/tqsdk/web;

    # The frontend uses /api as API_BASE; strip it and preserve WS upgrade.
    location /api/ {
        proxy_pass http://127.0.0.1:18081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-API-Key $http_x_api_key;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:18081/healthz;
        proxy_set_header Host $host;
    }

    # Static assets, plugin manifests and SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
