services:
  tqsdk:
    image: tqsdk:0.1.0
    container_name: tqsdk-demo
    ports:
      - "8080:8080"
    environment:
      TQSDK_ROLE: node
      TQSDK_LOG_LEVEL: info
    volumes:
      - tqsdk-state:/var/lib/tqsdk
      - tqsdk-logs:/var/log/tqsdk
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  tqsdk-state:
  tqsdk-logs:
